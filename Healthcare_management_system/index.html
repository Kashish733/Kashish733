<!DOCTYPE html>
<html>
<head>
    <title>APC FastAPI</title>
</head>
<body>
    <h1>Arlington Physicians' Center</h1>

    <h2>Queries</h2>
    <form action="/q1/add-speciality" method="post"><button type="submit">Q1: Add Speciality</button></form>
    <form action="/q2/patient-coverage" method="get"><button type="submit">Q2: Patient Insurance</button></form>
    <form action="/q3/update-followup" method="post"><button type="submit">Q3: Update Follow-Up</button></form>
    <form action="/q4/delete-location" method="post"><button type="submit">Q4: Delete Location</button></form>

    <h2>Views</h2>
    <form action="/views/hospitals_cityville" method="get"><button type="submit">QV1 - Hospitals in Cityville</button></form>
    <form action="/views/patients_over_30" method="get"><button type="submit">QV2 - Patients Over 30</button></form>
    <form action="/views/top_physician" method="get"><button type="submit">QV3 - Top Physician</button></form>
    <form action="/views/average_patient_age" method="get"><button type="submit">QV4 - Average Patient Age</button></form>

    <h2>Result</h2>
    <div>
        {{result}}
    </div>
</body>
</html>
